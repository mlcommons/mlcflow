name: Build wheel and release into PYPI

# Releases are tag-driven:
#   1. Land changes on main via PR (CI runs on every push/PR).
#   2. When ready to release, bump VERSION on main (single source of truth —
#      pyproject.toml reads it via [tool.setuptools.dynamic]).
#   3. Tag that commit and push the tag:
#        git tag v1.2.5 && git push origin v1.2.5
#   4. This workflow builds the wheel, publishes it to PyPI, and creates the
#      matching GitHub Release with auto-generated notes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build_wheels:
    if: github.repository_owner == 'mlcommons'
    name: Build wheel
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write   # OIDC trusted publishing to PyPI
      contents: write   # create the GitHub Release

    strategy:
      fail-fast: false
    steps:
      # Step 1: Only ever publish from a tag. A manual workflow_dispatch exists
      # so a failed release can be re-run without re-tagging, but it must be
      # dispatched against the tag ref — publishing off a branch would put a
      # wheel on PyPI with no tag and no GitHub Release behind it.
      - name: Require a tag ref
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow must run against a tag (got ${GITHUB_REF})."
            echo "Re-run it from the Actions UI with a tag such as v1.2.5 selected as the ref."
            exit 1
          fi

      # Step 2: Checkout the tagged commit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref_name }}

      # Step 3: Set up Python
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0

      # Step 4: The tag and the VERSION file must agree, otherwise we would
      # publish a wheel whose version does not match the ref it came from.
      - name: Verify tag matches VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION file ($file_version)."
            echo "Bump VERSION on main and re-tag that commit."
            exit 1
          fi
          echo "Releasing version $file_version"

      # Step 5: Install required dependencies
      - name: Install requirements
        run: python3 -m pip install setuptools wheel build

      # Step 6: Build the Python wheel and sdist
      - name: Build wheels
        working-directory: ./
        run: python3 -m build

      # Step 7: Publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          verify-metadata: true
          packages-dir: dist
          repository-url: https://upload.pypi.org/legacy/
          verbose: true

      # Step 8: Create the GitHub Release with auto-generated notes
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
