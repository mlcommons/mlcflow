name: Build wheel and release into PYPI

# Releases can start in two ways:
#   1. Push a tag such as v1.2.5 (existing behaviour).
#   2. Manually dispatch this workflow from main to have it compute the next
#      version (or use the supplied override), update VERSION, commit, tag,
#      publish to PyPI, and create the matching GitHub Release.
#
# Prereleases (alpha/beta/rc) follow the same path:
#     VERSION=1.4.0a1            # PEP 440: 1.4.0a1, 1.4.0b2, 1.4.0rc1
#     git tag v1.4.0a1 && git push origin v1.4.0a1
# The GitHub Release is then flagged as a prerelease so it does not displace
# the current stable as "Latest", and PyPI keeps a plain `pip install mlcflow`
# on the last final — testers opt in with `pip install mlcflow==1.4.0a1`.
#
# Note that a prerelease sorts BEFORE its final under PEP 440, so 1.4.0a1 does
# not satisfy a `mlcflow>=1.4.0` pin. Dependants that need to test against an
# alpha have to pin `>=1.4.0a1`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version. When omitted on main, the last numeric component in VERSION is incremented.
        required: false
        type: string

concurrency:
  group: build-wheels-release
  cancel-in-progress: false

jobs:
  build_wheels:
    if: github.repository_owner == 'mlcommons'
    name: Build wheel
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write   # OIDC trusted publishing to PyPI
      contents: write   # create the GitHub Release

    strategy:
      fail-fast: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MLC_AUTOMATIONS_APP_ID }}
          private-key: ${{ secrets.MLC_AUTOMATIONS_PRIVATE_KEY }}

      - name: Validate workflow_dispatch source
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${GITHUB_REF_TYPE}" in
            branch)
              if [ "${GITHUB_REF_NAME}" != "main" ]; then
                echo "::error::Manual releases must run from the main branch or from an existing release tag."
                echo "Re-run this workflow from main to cut a new release, or from a tag to retry a failed one."
                exit 1
              fi
              ;;
            tag)
              if [ -n "${{ inputs.version }}" ]; then
                echo "::error::Version overrides are only supported when dispatching from main."
                echo "Clear the version input when re-running an existing tagged release."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported ref type '${GITHUB_REF_TYPE}'."
              exit 1
              ;;
          esac

      # Step 1: Checkout the selected commit or tag.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Step 2: Set up Python
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0

      # Step 3: Install required dependencies. This runs before the version
      # selection and verification so both paths can parse versions with packaging.
      - name: Install requirements
        run: python3 -m pip install setuptools wheel build packaging

      # Step 4: When dispatched from main, update VERSION on main first and
      # then tag that exact commit before building. If version is omitted,
      # increment the right-most digits in VERSION (for example 1.3.7 ->
      # 1.3.8, 1.4.0rc1 -> 1.4.0rc2).
      - name: Prepare release from main
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'branch'
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Local checkout is not at the latest origin/main."
            echo "Re-run the workflow from main after refreshing the branch selection."
            exit 1
          fi

          new_version="$(python3 .github/scripts/release_version.py \
            --current-version-file VERSION \
            --requested-version "${REQUESTED_VERSION}")"
          release_tag="v${new_version}"

          if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${release_tag} already exists locally."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${release_tag} already exists on origin."
            exit 1
          fi

          printf '%s\n' "${new_version}" > VERSION

          git config user.name "mlc-automations"
          git config user.email "3246381+mlc-automations@users.noreply.github.com"

          if git diff --quiet -- VERSION; then
            echo "VERSION already set to ${new_version}; tagging the current main HEAD."
          else
            git add VERSION
            git commit -m "Bump VERSION to ${new_version}"
            git push origin HEAD:main
          fi

          release_commit="$(git rev-parse HEAD)"
          git tag "${release_tag}" "${release_commit}"
          git push origin "refs/tags/${release_tag}"
          git checkout "${release_tag}"

          echo "RELEASE_REF_TYPE=tag" >> "$GITHUB_ENV"
          echo "RELEASE_REF_NAME=${release_tag}" >> "$GITHUB_ENV"

      - name: Resolve release ref
        if: github.event_name != 'workflow_dispatch' || github.ref_type == 'tag'
        run: |
          echo "RELEASE_REF_TYPE=${GITHUB_REF_TYPE}" >> "$GITHUB_ENV"
          echo "RELEASE_REF_NAME=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      # Step 5: Only ever publish from a tag. A manual workflow_dispatch can
      # either create a new tag from main or retry a failed tagged release.
      - name: Require a tag ref
        run: |
          if [ "${RELEASE_REF_TYPE}" != "tag" ]; then
            echo "::error::This workflow must build from a tag (got ${RELEASE_REF_TYPE}:${RELEASE_REF_NAME})."
            exit 1
          fi

      # Step 6: The tag and the VERSION file must agree, otherwise we would
      # publish a wheel whose version does not match the ref it came from.
      # The version is also parsed here, before anything is built or
      # published: an unparseable version has to stop the release outright
      # rather than reappear later as a misclassified GitHub Release.
      - name: Verify tag matches VERSION
        run: |
          tag_version="${RELEASE_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag ${RELEASE_REF_NAME} does not match VERSION file ($file_version)."
            echo "Bump VERSION on main and re-tag that commit."
            exit 1
          fi

          # 'invalid' on an unparseable version; empty if python itself failed.
          # Both are treated as fatal - defaulting either way would silently
          # publish an alpha as the latest stable, or vice versa.
          version_kind="$(python3 -c "
          import sys
          from packaging.version import Version, InvalidVersion
          try:
              v = Version(sys.argv[1])
          except InvalidVersion:
              print('invalid')
          else:
              print('prerelease' if v.is_prerelease else 'final')
          " "$file_version")"

          case "$version_kind" in
            prerelease)
              echo "IS_PRERELEASE=true" >> "$GITHUB_ENV" ;;
            final)
              echo "IS_PRERELEASE=false" >> "$GITHUB_ENV" ;;
            invalid)
              echo "::error::VERSION '$file_version' is not a valid PEP 440 version."
              echo "Use a form such as 1.4.0, 1.4.0a1, 1.4.0b2 or 1.4.0rc1."
              exit 1 ;;
            *)
              echo "::error::Could not determine whether '$file_version' is a prerelease."
              exit 1 ;;
          esac

          echo "Releasing version $file_version ($version_kind)"

      # Step 7: Build the Python wheel and sdist
      - name: Build wheels
        working-directory: ./
        run: python3 -m build

      # Step 8: Publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          verify-metadata: true
          packages-dir: dist
          repository-url: https://upload.pypi.org/legacy/
          verbose: true

      # Step 9: Create the GitHub Release with auto-generated notes.
      # An alpha/beta/rc is marked as a prerelease so it does not take over
      # "Latest" on the releases page from the current stable. PyPI derives
      # this from the version itself, but the GitHub Release does not.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "${IS_PRERELEASE}" = "true" ]; then
            echo "${RELEASE_REF_NAME} is a prerelease; marking the GitHub Release accordingly."
            prerelease_flag="--prerelease"
          else
            prerelease_flag=""
          fi
          if gh release view "$RELEASE_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_REF_NAME} already exists; uploading refreshed artifacts."
            gh release upload "$RELEASE_REF_NAME" dist/* --clobber
          else
            gh release create "$RELEASE_REF_NAME" \
              --title "$RELEASE_REF_NAME" \
              --generate-notes \
              $prerelease_flag \
              dist/*
          fi
