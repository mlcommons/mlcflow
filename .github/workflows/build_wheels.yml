name: Build wheel and release into PYPI

# Two ways to start a release, both of which publish from a v* tag:
#
#   A. Tag-driven: bump VERSION on main via PR, then
#      `git tag -a v1.2.5 -m "v1.2.5" && git push origin v1.2.5`.
#   B. Dispatch-driven: "Run workflow" against main. `prepare` resolves the
#      version, optionally bumps VERSION, and pushes the tag as the
#      mlc-automations App — an App-token push re-triggers workflows, so that
#      tag push enters path A.
#
# A published version is final: PyPI rejects re-uploads, so every path that
# resolves to an already-released version is refused up front by
# .github/scripts/resolve_release_version.py, with no override. To retry a
# failed release use "Re-run jobs" on the failed run, not a second dispatch.
# If a release published to PyPI but left no GitHub Release, create it by hand
# with `gh release create vX.Y.Z --generate-notes`.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Increment VERSION on the default branch before releasing"
        type: choice
        default: none
        options:
          - none      # release VERSION as it already stands
          - patch     # bug fixes:      x.y.Z
          - minor     # new features:   x.Y.0
          - major     # breaking change: X.0.0
      dry_run:
        description: "Validate and build only — do not commit, tag, or publish"
        type: boolean
        default: false

# Upgrades every `run:` from the implicit `bash -e {0}` to `-eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  # Turns a dispatch into the tag path A already knows how to build. Not
  # narrowed to branch refs here: a dispatch against a tag deserves the error
  # message below, not a run with no jobs in it.
  prepare:
    name: Resolve version and tag
    if: >-
      github.repository_owner == 'mlcommons'
      && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # One preparation at a time. Overlapping dispatches would both resolve
    # against the pre-release state and collide on the push; queued, the second
    # is refused by the tag guard or by the script's "already ahead" check.
    # Never cancel: interrupting between the VERSION push and the tag push is
    # worse than waiting.
    concurrency:
      group: release-prepare
      cancel-in-progress: false

    permissions:
      contents: read    # the bump and the tag are pushed with the App token below

    # Read by git directly; GIT_COMMITTER_* also stamps the annotated tag's tagger.
    env:
      GIT_AUTHOR_NAME: mlc-automations
      GIT_COMMITTER_NAME: mlc-automations
      GIT_AUTHOR_EMAIL: "3246381+mlc-automations@users.noreply.github.com"
      GIT_COMMITTER_EMAIL: "3246381+mlc-automations@users.noreply.github.com"

    steps:
      # Releases come from the default branch only. (We may later want to allow
      # alpha/beta releases from development branches.)
      - name: Require the default branch
        env:
          default_branch: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "$default_branch" ]; then
            echo "::error::Releases must be dispatched against ${default_branch} (got ${GITHUB_REF_NAME})."
            echo "To cut a release: land the change on ${default_branch} via PR, then dispatch against it."
            echo "To retry a release that failed: re-run the failed workflow run for its tag."
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MLC_AUTOMATIONS_APP_ID }}
          private-key: ${{ secrets.MLC_AUTOMATIONS_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Rewrites VERSION in the working tree when bumping; nothing is pushed yet.
      - name: Resolve release version
        id: resolve
        env:
          MODE: resolve
          BUMP: ${{ inputs.bump }}
        run: python3 .github/scripts/resolve_release_version.py

      # Never move an existing tag: the wheel behind it is already public.
      - name: Require an unused tag
        env:
          tag: ${{ steps.resolve.outputs.tag }}
        run: |
          # Assigned, not inlined into the `if`: a command substitution inside an
          # if-condition is exempt from errexit, so a failed ls-remote would come
          # back empty and silently pass this guard.
          remote_tag="$(git ls-remote --tags origin "refs/tags/${tag}")"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null \
            || [ -n "$remote_tag" ]; then
            echo "::error::Tag ${tag} already exists."
            echo "Releases are immutable, so this tag will not be moved."
            echo "Pick a different bump level, or — if ${tag}'s release failed —"
            echo "re-run that tag's failed workflow run instead of dispatching this one."
            exit 1
          fi

      # Prove the version packages before stopping. Everything after is a mutation.
      - name: Build wheels (dry run check)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          python3 -m pip install --quiet build
          python3 -m build
          echo "Dry run: resolved ${{ steps.resolve.outputs.version }} and built it successfully."
          echo "Nothing was committed, tagged, or published."

      - name: Commit the VERSION bump
        if: ${{ github.event.inputs.dry_run != 'true' && steps.resolve.outputs.bumped == 'true' }}
        env:
          version: ${{ steps.resolve.outputs.version }}
        run: |
          git add VERSION
          git commit -m "[Automated Commit] Bump VERSION to ${version}"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      # This push is what starts `publish`, in a new run against the tag.
      - name: Create and push the release tag
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          tag: ${{ steps.resolve.outputs.tag }}
        run: |
          git tag -a "${tag}" -m "${tag}"
          git push origin "refs/tags/${tag}"
          echo "::notice::Pushed ${tag} — follow the release in the workflow run triggered by that tag."

  # The only job that uploads to PyPI, entered solely by a v* tag push.
  publish:
    name: Build wheel
    # `ref_type == 'tag'` is not redundant with `on.push.tags`: tag pushes and
    # branch pushes are both `push` events, so re-adding `branches:` above would
    # otherwise make this publish on ordinary branch pushes — as this workflow
    # was configured before 2026-08-03.
    if: >-
      github.repository_owner == 'mlcommons'
      && github.event_name == 'push'
      && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release

    # Per tag, so a re-run cannot race the run it retries on the upload and the
    # Release. Keyed on the ref because distinct tags share no mutable state.
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      id-token: write   # OIDC trusted publishing to PyPI
      contents: write   # create the GitHub Release

    steps:
      # No `ref:` — the default is the triggering ref, already pinned to a tag.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0

      - name: Verify tag matches VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION file ($file_version)."
            echo "Bump VERSION on main and re-tag that commit."
            exit 1
          fi
          echo "Releasing version $file_version"

      # Fail before building rather than at the upload. No override by design.
      - name: Verify the version is publishable
        env:
          MODE: verify
        run: python3 .github/scripts/resolve_release_version.py

      # `build` alone is enough: it installs setuptools/wheel into its isolated
      # env from [build-system] requires.
      - name: Install requirements
        run: python3 -m pip install build

      - name: Build wheels
        run: python3 -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          verify-metadata: true
          packages-dir: dist
          repository-url: https://upload.pypi.org/legacy/
          verbose: true

      # A Release can pre-exist (drafted by hand, or a re-run that got this far).
      # The upload above already succeeded, so attach artifacts rather than
      # losing the run on `gh release create` at the last step.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refreshing its artifacts."
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist/*
          fi
