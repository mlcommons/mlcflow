name: AI PR Review (Incremental)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Install dependencies
        run: |
          pip install requests jq

      - name: Fetch PR head
        run: |
          git fetch origin ${{ github.event.pull_request.head.sha }}
      
      - name: Get incremental diff
        id: diff
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git diff $BASE_SHA...$HEAD_SHA > pr.diff

          if [ ! -s pr.diff ]; then
            echo "EMPTY_DIFF=true" >> $GITHUB_ENV
          fi

      - name: Run OpenAI review
        if: env.EMPTY_DIFF != 'true'
        run: |
          python3 << 'EOF'
          import os, json, requests

          OPENAI_API_KEY = os.environ["OPENAI_API_KEY"]
          DIFF = open("pr.diff").read()[:15000]

          def extract_response_text(data):
              output_text = data.get("output_text")
              if isinstance(output_text, str) and output_text.strip():
                  return output_text.strip()

              texts = []
              for item in data.get("output", []):
                  for content in item.get("content", []):
                      text = content.get("text")
                      if isinstance(text, str) and text.strip():
                          texts.append(text.strip())
                      elif isinstance(text, dict):
                          value = text.get("value")
                          if isinstance(value, str) and value.strip():
                              texts.append(value.strip())

              return "\n".join(texts).strip()

          def strip_code_fences(text):
              text = text.strip()
              if not text.startswith("```"):
                  return text

              lines = text.splitlines()
              if len(lines) < 2 or lines[-1].strip() != "```":
                  return text

              lines = lines[1:-1]

              return "\n".join(lines).strip()

          prompt = f"""
          Review this incremental pull request diff for a public engineering repository.

          Tasks:
          1. Write a professional PR summary in 2-4 sentences that:
             - explains the main change clearly
             - notes any material risk or follow-up
             - avoids hype, praise, or filler
             - says plainly when risk is low
          2. Provide inline review comments only for concrete, actionable issues.
             Return an empty comments list when there are no such issues.
             Each inline comment must include:
             - file
             - line
             - comment

          Respond ONLY in valid JSON with this schema:
          {{
            "summary": "string",
            "comments": [
              {{
                "file": "path/to/file",
                "line": 123,
                "comment": "text"
              }}
            ]
          }}

          Diff:
          {DIFF}
          """

          response = requests.post(
              "https://api.openai.com/v1/responses",
              headers={
                  "Authorization": f"Bearer {OPENAI_API_KEY}",
                  "Content-Type": "application/json"
              },
              json={
                  "model": "gpt-4.1-mini",
                  "input": prompt,
                  "temperature": 0.2
              },
              timeout=60
          )

          response.raise_for_status()
          data = response.json()
          text = strip_code_fences(extract_response_text(data))
          if not text:
              raise RuntimeError(
                  "OpenAI review response did not contain any text output: "
                  + json.dumps(data)[:1000]
              )

          parsed = json.loads(text)
          with open("ai_output.json", "w") as f:
              json.dump(parsed, f, indent=2)
          EOF
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Post PR summary comment
        if: env.EMPTY_DIFF != 'true'
        run: |
          SUMMARY=$(jq -r '.summary' ai_output.json)
          BODY=$(printf '%s\n\n%s\n' '## 🤖 AI Peer Review' "$SUMMARY")

          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post inline review comments
        if: env.EMPTY_DIFF != 'true'
        continue-on-error: true
        run: |
          while IFS= read -r c; do
            FILE=$(jq -r '.file' <<<"$c")
            LINE=$(jq -r '.line' <<<"$c")
            COMMENT=$(jq -r '.comment' <<<"$c")

            if ! [[ "$LINE" =~ ^[0-9]+$ ]]; then
              echo "::warning::Skipping AI review comment with invalid line number for $FILE: $LINE"
              continue
            fi
            if [ -z "$COMMENT" ] || [ "$COMMENT" = "null" ]; then
              echo "::warning::Skipping AI review comment with empty body for $FILE:$LINE"
              continue
            fi

            gh api \
              repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
              -f body="$COMMENT" \
              -f commit_id="${{ github.event.pull_request.head.sha }}" \
              -f path="$FILE" \
              -F line="$LINE" \
              -f side="RIGHT" \
              -f subject_type="line" || echo "::warning::Failed to post AI inline review comment for $FILE:$LINE"
          done < <(jq -c '.comments[]?' ai_output.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
