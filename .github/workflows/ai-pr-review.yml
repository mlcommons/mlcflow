name: AI PR Review (Incremental)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Install dependencies
        run: |
          pip install requests jq

      - name: Fetch PR head
        run: |
          git fetch origin ${{ github.event.pull_request.head.sha }}
      
      - name: Get incremental diff
        id: diff
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git diff $BASE_SHA...$HEAD_SHA > pr.diff

          if [ ! -s pr.diff ]; then
            echo "EMPTY_DIFF=true" >> $GITHUB_ENV
          fi

      - name: Run OpenAI review
        if: env.EMPTY_DIFF != 'true'
        run: |
          python3 << 'EOF'
          import os, json, requests

          OPENAI_API_KEY = os.environ["OPENAI_API_KEY"]
          DIFF = open("pr.diff").read()[:15000]

          prompt = f"""
          Review this incremental pull request diff.

          Tasks:
          1. Write a concise PR summary (overall risks, design issues).
          2. Provide inline review comments with:
             - file
             - line
             - comment

          Respond ONLY in valid JSON with this schema:
          {{
            "summary": "string",
            "comments": [
              {{
                "file": "path/to/file",
                "line": 123,
                "comment": "text"
              }}
            ]
          }}

          Diff:
          {DIFF}
          """

          response = requests.post(
              "https://api.openai.com/v1/responses",
              headers={
                  "Authorization": f"Bearer {OPENAI_API_KEY}",
                  "Content-Type": "application/json"
              },
              json={
                  "model": "gpt-4.1-mini",
                  "input": prompt,
                  "temperature": 0.2
              },
              timeout=120,
          )

          if not response.ok:
              print(f"::error::OpenAI API request failed with HTTP {response.status_code}: {response.text[:2000]}")
              raise SystemExit(1)

          data = response.json()

          text = None
          for item in data.get("output", []):
              if item.get("type") == "message":
                  for block in item.get("content", []):
                      if "text" in block:
                          text = block["text"]
                          break
              if text:
                  break

          if text is None:
              print(f"::error::Could not find message text in OpenAI response: {json.dumps(data)[:2000]}")
              raise SystemExit(1)

          # Models sometimes wrap JSON in a markdown code fence despite instructions not to.
          stripped = text.strip()
          if stripped.startswith("```"):
              stripped = stripped.strip("`")
              if stripped.startswith("json"):
                  stripped = stripped[len("json"):]
              stripped = stripped.strip()

          try:
              parsed = json.loads(stripped)
          except json.JSONDecodeError as e:
              print(f"::error::Failed to parse JSON from OpenAI response: {e}\nRaw text: {text[:2000]}")
              raise SystemExit(1)

          with open("ai_output.json", "w") as f:
              json.dump(parsed, f, indent=2)
          EOF
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Post PR summary comment
        if: env.EMPTY_DIFF != 'true'
        run: |
          {
            echo "## 🤖 AI PR Review Summary"
            echo
            jq -r '.summary' ai_output.json
          } > summary_comment.md
          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file summary_comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post inline review comments
        if: env.EMPTY_DIFF != 'true'
        continue-on-error: true
        run: |
          jq -c '.comments[]?' ai_output.json | while read -r c; do
            FILE=$(echo "$c" | jq -r '.file')
            LINE=$(echo "$c" | jq -r '.line')
            COMMENT=$(echo "$c" | jq -r '.comment')

            if ! [[ "$LINE" =~ ^[0-9]+$ ]]; then
              echo "::warning::Skipping AI review comment with invalid line number for $FILE: $LINE"
              continue
            fi

            gh api \
              repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments \
              -f body="$COMMENT" \
              -f commit_id="${{ github.event.pull_request.head.sha }}" \
              -f path="$FILE" \
              -F line="$LINE" \
              -f side="RIGHT" || echo "::warning::Failed to post AI inline review comment for $FILE:$LINE"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
