[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlcflow"
version = "2.0.0"

description = "An automation interface tailored for CPU/GPU benchmarking"
authors = [
    { name = "MLCommons", email = "systems@mlcommons.org" }
]
license = { file = "LICENSE.md" }
readme = "README.md"
requires-python = ">=3.7"
keywords = ["mlc", "mlcflow", "pypi", "package", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests",
    "pyyaml",
    "giturlparse",
    "colorama",
    "filelock"
]

[project.urls]
Homepage = "https://github.com/mlcommons/mlcflow"
Documentation = "https://docs.mlcommons.org/mlcflow"
Repository = "https://github.com/mlcommons/mlcflow"
Issues = "https://github.com/mlcommons/mlcflow/issues"

[tool.setuptools]
packages = ["mlc", "mlc.engine"]
py-modules = []

[tool.setuptools.package-data]
# Ship the automation-type meta (alias: script) alongside the engine so
# ScriptAutomation can load self.meta from the package itself.
"mlc.engine" = ["meta.json"]

[project.scripts]
mlc = "mlc.main:main"
mlcflow = "mlc.main:main"
mlcr = "mlc.main:mlcr"
mlcrr = "mlc.main:mlcrr"
mlcd = "mlc.main:mlcd"
mlca = "mlc.main:mlca"
mlce = "mlc.main:mlce"
mlct = "mlc.main:mlct"
mlcp = "mlc.main:mlcp"
mlcre = "mlc.main:mlcre"
mlcrd = "mlc.main:mlcrd"
